name: Live Conformance Gates

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      run_benchmark_gate:
        description: Run the benchmark regression gate (best on a stable runner)
        required: false
        default: false
        type: boolean

jobs:
  live-conformance-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      LIVE_RUN_ID: ci-live
      ADV_RUN_ID: ci-adv
      RAPTORQ_RUN_ID: ci-raptorq
      FORENSICS_ROOT: artifacts/failure_forensics

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Redis
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server

      - name: Install Rust Nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache Rust Build Artifacts
        uses: Swatinem/rust-cache@v2

      - name: Start Redis Server
        run: redis-server --save "" --appendonly no --daemonize yes

      - name: Prepare Failure Forensics Directories
        run: mkdir -p "${FORENSICS_ROOT}/${LIVE_RUN_ID}"

      - name: G1 - Verify Formatting
        run: cargo fmt --check

      - name: G1 - Verify Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: G2 - Run Unit and Property Baseline
        run: cargo test --workspace -- --nocapture

      - name: G3+G5 - Run Live Oracle Differential Suites
        run: |
          ./scripts/run_live_oracle_diff.sh \
            --host 127.0.0.1 \
            --port 6379 \
            --output-root artifacts/e2e_orchestrator \
            --run-id "${LIVE_RUN_ID}"

      - name: G3+G5 - Lua String Differential Sweep
        # Byte-exhaustive reply comparison of fr's Lua string library against the
        # vendored incumbent: ~900 comparisons across 12 cases, run as ONE EVAL per
        # engine so the whole sweep is a couple of round trips.
        #
        # A DEBUG binary is correct here on purpose -- this gate compares REPLIES,
        # never timings, so it needs no release build and is unaffected by runner
        # contention. It starts its own fr and redis on private ports and shuts both
        # down in a finally block, so it does not touch the 6379 server above.
        #
        # Exit code means a NEW divergence: rows listed in EXPECTED_DIVERGENCES are
        # printed with their reason but do not fail, and an expectation that has
        # stopped firing fails the gate so a stale entry cannot mask a regression of
        # its own row.
        run: |
          cargo build -p fr-server
          python3 scripts/lua_string_differential_sweep.py target/debug/frankenredis \
            | tee "${FORENSICS_ROOT}/${LIVE_RUN_ID}/lua_string_sweep.log"

      - name: G3+G5 - Client-Path Protocol Parity
        # Byte-exact comparison of fr's CLIENT protocol contract against the vendored
        # incumbent over real TCP sockets: 45 adversarial vectors, one fresh connection
        # each, comparing reply bytes AND whether the connection was closed.
        #
        # This exists because protocol_negative.json does NOT cover this surface
        # (frankenredis-vqiki). That fixture drives Runtime::execute_bytes, an INTERNAL
        # link reached by replication and AOF replay, and all 22 of its expectations
        # differ from what a client receives -- a client sending `$-2` gets
        # "unknown command", not "invalid bulk length". A fixture written from the
        # implementation cannot detect the implementation being wrong, so the incumbent
        # is the oracle here and fr's own answers are never the expectation.
        #
        # A DEBUG binary is correct on purpose, as above: this compares REPLIES, never
        # timings. It starts its own fr and redis on private ports (28871/28872) and
        # terminates both in a finally block, so it does not touch the 6379 server.
        run: |
          cargo build -p fr-server
          python3 scripts/protocol_client_parity.py \
            --fr target/debug/frankenredis \
            --redis "$(command -v redis-server)" \
            --json "${FORENSICS_ROOT}/${LIVE_RUN_ID}/protocol_client_parity.json" \
            | tee "${FORENSICS_ROOT}/${LIVE_RUN_ID}/protocol_client_parity.log"

      - name: G3+G5 - Capability Bead Parity Triage
        # Runs each CLOSED capability bead's own shape against the live incumbent, so the
        # eight beads closed on 2026-08-19 have a regression check they did not previously
        # have -- their fixes were pinned by unit tests, never by a live-oracle differential.
        #
        # Exit 1 means a bead believed fixed has started diverging again. Beads listed in
        # KNOWN_LIVE (currently lua-call-depth-ug22x) are expected to diverge and do not fail
        # the gate; one of them AGREEING is reported as STALE-EXPECT, because good news that
        # can hide is how a stale expectation masks a regression of its own row.
        #
        # Debug binary on purpose: this compares REPLIES, never timings. Private ports
        # 28911/28912, so it does not touch the 6379 server this job already started.
        run: |
          cargo build -p fr-server
          python3 scripts/bead_parity_triage.py \
            --fr target/debug/frankenredis \
            --redis "$(command -v redis-server)" \
            | tee "${FORENSICS_ROOT}/${LIVE_RUN_ID}/bead_parity_triage.log"

      - name: G7 - Enforce Coverage/Flake Budgets
        run: ./scripts/check_coverage_flake_budget.sh "artifacts/e2e_orchestrator/${LIVE_RUN_ID}/coverage_summary.json"

      - name: G4 - Run Adversarial Triage
        run: |
          ./scripts/run_adversarial_triage.sh \
            --output-root artifacts/adversarial_triage \
            --run-id "${ADV_RUN_ID}" \
            --runner local

      - name: G6 - Run Optimization Gate
        run: |
          set -euo pipefail
          cargo run -p fr-conformance --bin phase2c_schema_gate -- --optimization-gate \
            | tee "${FORENSICS_ROOT}/${LIVE_RUN_ID}/optimization_gate_stdout.log"

      - name: G6 - Run Benchmark Regression Gate
        if: github.event_name == 'workflow_dispatch' && inputs.run_benchmark_gate
        env:
          FR_BENCH_BUILD_RUNNER: local
          FR_BENCH_THROUGHPUT_DROP_PCT: "15"
          FR_BENCH_P99_REGRESSION_PCT: "10"
        run: |
          ./scripts/benchmark_gate.sh \
            --out-dir artifacts/benchmark \
            --run-id "ci-${GITHUB_RUN_ID}"

      - name: G7 - Run User Workflow Corpus Gate
        run: |
          cargo run -p fr-conformance --bin user_journey_corpus_gate -- \
            --manifest crates/fr-conformance/fixtures/user_workflow_corpus_v1.json \
            --json-out "${FORENSICS_ROOT}/${LIVE_RUN_ID}/user_journey_corpus_report.json"

      - name: G7 - Run Packet Schema Gate
        run: |
          set -euo pipefail
          mapfile -t candidate_packet_dirs < <(
            find crates/fr-conformance/fixtures/phase2c \
              -mindepth 1 -maxdepth 1 -type d \
              -regextype posix-extended \
              -regex '.*/FR-P2C-[0-9]{3}$' \
              | sort
          )
          packet_dirs=()
          for dir in "${candidate_packet_dirs[@]}"; do
            if [ -f "${dir}/parity_report.json" ]; then
              packet_dirs+=("${dir}")
            fi
          done
          if [ "${#packet_dirs[@]}" -eq 0 ]; then
            echo "no packet directories with parity_report.json found under crates/fr-conformance/fixtures/phase2c" >&2
            exit 1
          fi
          printf '%s\n' "${packet_dirs[@]}" > "${FORENSICS_ROOT}/${LIVE_RUN_ID}/phase2c_packet_dirs.txt"
          cargo run -p fr-conformance --bin phase2c_schema_gate -- "${packet_dirs[@]}" \
            | tee "${FORENSICS_ROOT}/${LIVE_RUN_ID}/phase2c_schema_gate_stdout.log"

      - name: G8 - Run RaptorQ Artifact Gate
        run: |
          ./scripts/run_raptorq_artifact_gate.sh \
            --output-root artifacts/durability/raptorq_runs \
            --run-id "${RAPTORQ_RUN_ID}"

      - name: G7 - Build Failure Forensics Index
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, UTC
          from pathlib import Path

          live_run_id = os.environ["LIVE_RUN_ID"]
          adv_run_id = os.environ["ADV_RUN_ID"]
          raptorq_run_id = os.environ["RAPTORQ_RUN_ID"]
          forensics_root = Path(os.environ["FORENSICS_ROOT"]) / live_run_id
          forensics_root.mkdir(parents=True, exist_ok=True)

          artifact_paths = [
              Path(f"artifacts/e2e_orchestrator/{live_run_id}/suite_status.tsv"),
              Path(f"artifacts/e2e_orchestrator/{live_run_id}/command_trace.log"),
              Path(f"artifacts/e2e_orchestrator/{live_run_id}/coverage_summary.json"),
              Path(f"artifacts/e2e_orchestrator/{live_run_id}/failure_envelope.json"),
              Path(f"artifacts/e2e_orchestrator/{live_run_id}/replay_all.sh"),
              Path(f"artifacts/e2e_orchestrator/{live_run_id}/replay_failed.sh"),
              Path(f"artifacts/e2e_orchestrator/{live_run_id}/reliability_budget_result.json"),
              Path(f"artifacts/e2e_orchestrator/{live_run_id}/flake_quarantine_candidates.txt"),
              Path(f"artifacts/adversarial_triage/{adv_run_id}/triage_report.json"),
              Path(f"artifacts/adversarial_triage/{adv_run_id}/triage_routes.tsv"),
              Path(f"artifacts/adversarial_triage/{adv_run_id}/env.json"),
              Path(f"artifacts/adversarial_triage/{adv_run_id}/manifest.json"),
              Path(f"artifacts/adversarial_triage/{adv_run_id}/repro.lock"),
              Path(f"artifacts/durability/raptorq_runs/{raptorq_run_id}/report.json"),
              Path(f"artifacts/durability/raptorq_runs/{raptorq_run_id}/artifacts.ndjson"),
              forensics_root / "optimization_gate_stdout.log",
              forensics_root / "user_journey_corpus_report.json",
              forensics_root / "phase2c_packet_dirs.txt",
              forensics_root / "phase2c_schema_gate_stdout.log",
          ]

          entries = []
          for path in artifact_paths:
              item = {
                  "path": path.as_posix(),
                  "exists": path.exists(),
              }
              if path.exists() and path.is_file():
                  payload = path.read_bytes()
                  item["size_bytes"] = len(payload)
                  item["sha256"] = hashlib.sha256(payload).hexdigest()
              entries.append(item)

          index = {
              "schema_version": "fr_failure_forensics_index/v1",
              "run_id": live_run_id,
              "generated_at_utc": datetime.now(UTC).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "present_artifact_count": sum(1 for entry in entries if entry["exists"]),
              "missing_artifact_count": sum(1 for entry in entries if not entry["exists"]),
              "artifacts": entries,
          }
          out_path = forensics_root / "index.json"
          out_path.write_text(json.dumps(index, indent=2) + "\n", encoding="utf-8")
          print(f"forensics_index: {out_path.as_posix()}")
          print(f"present_artifact_count: {index['present_artifact_count']}")
          print(f"missing_artifact_count: {index['missing_artifact_count']}")
          PY

      - name: Upload Live Oracle Bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-orchestrator-${{ env.LIVE_RUN_ID }}
          path: artifacts/e2e_orchestrator/${{ env.LIVE_RUN_ID }}
          if-no-files-found: warn

      - name: Upload Adversarial Triage Bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adversarial-triage-${{ env.ADV_RUN_ID }}
          path: artifacts/adversarial_triage/${{ env.ADV_RUN_ID }}
          if-no-files-found: warn

      - name: Upload RaptorQ Artifact Gate Bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raptorq-artifact-gate-${{ env.RAPTORQ_RUN_ID }}
          path: artifacts/durability/raptorq_runs/${{ env.RAPTORQ_RUN_ID }}
          if-no-files-found: warn

      - name: Upload Failure Forensics Index Bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-forensics-${{ env.LIVE_RUN_ID }}
          path: ${{ env.FORENSICS_ROOT }}/${{ env.LIVE_RUN_ID }}
          if-no-files-found: warn

      - name: Upload Benchmark Regression Bundle
        if: always() && github.event_name == 'workflow_dispatch' && inputs.run_benchmark_gate
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-regression-${{ github.run_id }}
          path: artifacts/benchmark/ci-${{ github.run_id }}
          if-no-files-found: warn
