[workspace]
resolver = "2"
members = [
  "crates/fr-bench",
  "crates/fr-eventloop",
  "crates/fr-protocol",
  "crates/fr-command",
  "crates/fr-simd",
  "crates/fr-store",
  "crates/fr-expire",
  "crates/fr-persist",
  "crates/fr-repl",
  "crates/fr-config",
  "crates/fr-conformance",
  "crates/fr-runtime",
  "crates/fr-sentinel",
  "crates/fr-server",
  "crates/fr-fec",
  "crates/fr-uring",
]

[workspace.package]
edition = "2024"
version = "0.2.0"
license-file = "LICENSE"

[profile.release]
opt-level = 3

# (gauntlet) Dedicated profiling profile per the keep-gate rules: perf claims
# must be measured here, never on size-optimized `--release`. Inherits release
# but pins LTO/codegen-units for stable attribution and keeps frame pointers +
# symbols so flamegraph/samply/perf can resolve frames.
[profile.release-perf]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
strip = false

[workspace.dependencies]
arbitrary = { version = "1.5.0", features = ["derive"] }
hdrhistogram = "7.6.0"
hex = "0.4.3"
libc = "0.2.191"
libfuzzer-sys = "0.4.13"
mimalloc = "0.1.52"
memchr = "2.8.3"
mio = { version = "1.2.5", features = ["net", "os-ext", "os-poll"] }
proptest = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
raptorq = "1.8.1"
sha2 = "0.11.1"
tikv-jemallocator = "0.7.0"
