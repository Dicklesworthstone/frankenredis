[package]
name = "fr-runtime"
version = "0.1.0"
edition = "2024"

[features]
bench-reference = []
perf-ab-xtrim-minid-noop = [
    "fr-command/perf-ab-xtrim-minid-noop",
    "fr-store/perf-ab-xtrim-minid-noop",
]
# (frankenredis-aqkvk) Forwards the fr-persist A/B arm so the allocation census
# can select the pre-lever decode from one source tree.
perf-ab-rdb-hash-owned = ["fr-persist/perf-ab-rdb-hash-owned"]
perf-ab-tail-entry-bytes = ["fr-store/perf-ab-tail-entry-bytes"]
perf-ab-chunk-bytes-carry = ["fr-store/perf-ab-chunk-bytes-carry"]
# (frankenredis-qj6jn) Forwards the fresh-key bulk list build control arm.
perf-ab-list-bulk-build = ["fr-store/perf-ab-list-bulk-build"]
# (frankenredis-qj6jn) Forwards the promoted-list node capacity control arm.
perf-ab-list-node-capacity = ["fr-store/perf-ab-list-node-capacity"]
# (frankenredis-qj6jn) Forwards the quicklist node capacity control arm.
perf-ab-quicklist-node-capacity = ["fr-persist/perf-ab-quicklist-node-capacity"]
# (frankenredis-qj6jn) Forwards the fresh-key ZADD collapse-order control arm.
perf-ab-zset-collapse-order = ["fr-store/perf-ab-zset-collapse-order"]

[dependencies]
foldhash = "0.2"
hex.workspace = true
fr-command = { version = "0.1.0", path = "../fr-command" }
fr-config = { version = "0.1.0", path = "../fr-config" }
fr-eventloop = { version = "0.1.0", path = "../fr-eventloop" }
fr-persist = { version = "0.1.0", path = "../fr-persist" }
fr-protocol = { version = "0.1.0", path = "../fr-protocol" }
fr-repl = { version = "0.1.0", path = "../fr-repl" }
fr-store = { version = "0.1.0", path = "../fr-store" }
libc.workspace = true
sha2.workspace = true

[dev-dependencies]
proptest.workspace = true


[[bench]]
name = "replconf_option"
harness = false
required-features = ["bench-reference"]

[[bench]]
name = "replconf_ack_snapshot"
harness = false
required-features = ["bench-reference"]

[[bench]]
name = "pubsub_pending_clients"
harness = false
required-features = ["bench-reference"]

[[bench]]
name = "client_list_id_lookup"
harness = false
required-features = ["bench-reference"]

[[bench]]
name = "config_get_static_lookup"
harness = false
required-features = ["bench-reference"]

[[bench]]
name = "replica_frame_borrow"
harness = false
required-features = ["bench-reference"]

[[bench]]
name = "set_ok_reply_alloc"
harness = false
required-features = ["bench-reference"]

[[bench]]
name = "set_relexpire_ok_reply_alloc"
harness = false
required-features = ["bench-reference"]

[[bench]]
name = "set_absexpire_ok_reply_alloc"
harness = false
required-features = ["bench-reference"]

[[bench]]
name = "mset_ok_reply_alloc"
harness = false
required-features = ["bench-reference"]

[[bench]]
name = "hmset_ok_reply_alloc"
harness = false
required-features = ["bench-reference"]

[[bench]]
name = "setex_ok_reply_alloc"
harness = false
required-features = ["bench-reference"]

[[bench]]
name = "rename_ok_reply_alloc"
harness = false
required-features = ["bench-reference"]

[[bench]]
name = "set_nx_ok_reply_alloc"
harness = false
required-features = ["bench-reference"]

[[bench]]
name = "set_xx_ok_reply_alloc"
harness = false
required-features = ["bench-reference"]

# (frankenredis-hqca6) Literal-current profile, then same-binary proof, for maintaining the
# CLIENT TRACKING BCAST derived index only when tracking state changes instead of on every
# multi-client session snapshot.
[[bench]]
name = "client_tracking_membership"
harness = false
required-features = ["bench-reference"]

# (frankenredis-ktcqz) Same-binary A/B for command-histogram recording on the
# reactor GET fast path. Both arms are the two settings of the real
# `latency-tracking` knob, so the measured delta is the cost a default
# deployment pays rather than that of a synthetic toggle.
[[bench]]
name = "reactor_fastpath_histogram"
harness = false
