[package]
name = "fr-server"
version.workspace = true
edition.workspace = true
license-file.workspace = true
description = "FrankenRedis standalone server binary"

[lib]
name = "fr_server"
path = "src/lib.rs"

[[bin]]
name = "frankenredis"
path = "src/main.rs"

[dependencies]
fr-runtime = { path = "../fr-runtime" }
fr-store = { path = "../fr-store" }
fr-config = { path = "../fr-config" }
fr-protocol = { path = "../fr-protocol" }
fr-repl = { path = "../fr-repl" }
fr-persist = { path = "../fr-persist" }
fr-command = { path = "../fr-command" }
fr-eventloop = { path = "../fr-eventloop" }
fr-uring = { path = "../fr-uring", optional = true }
foldhash = "0.2"
mio.workspace = true
tikv-jemallocator = { workspace = true, optional = true }
mimalloc = { workspace = true, optional = true }

[features]
# mimalloc by default: 63.6% vs 36.5% geomean parity, 70x better p99 tails
default = ["mimalloc"]
# io_uring multishot receive and batched write submission. Default OFF.
#
# A 2026-07-25 `perf trace -s` census at `-P1 -c50` found one `sendto` per
# operation (229,740 calls = 47.4% of wall time) while a single `epoll_wait`
# already reports ~48 ready connections. This feature defers those per-connection
# writes to the end of the event-loop iteration and submits them as one SQ
# publication. Owned reply buffers stay registered until asynchronous CQ drain.
# Vendored Redis 7.2.4 measures the same shape (one `write` per op, 44.8% of
# wall) and its per-client write loop cannot batch this way.
#
# Explicitly NOT a pipelined-throughput lever: at `-P16` the same census measures
# 0.13-0.16 syscalls/op for both engines because a whole batch already coalesces
# into one write. See docs/NEGATIVE_EVIDENCE.md 2026-07-25.
#
# Shared-nothing workers also keep one provided-buffer multishot receive armed
# per connection, removing client sockets from the epoll read set and avoiding
# receive submission syscalls after connection setup.
#
# The feature only compiles support. Runtime activation additionally requires
# `--io-uring-output`; an explicit request fails closed if ring creation fails.
# Without the flag, the exact same ELF takes the behaviorally unchanged `mio`
# control path.
io-uring-writes = ["dep:fr-uring"]
jemalloc = ["dep:tikv-jemallocator"]
mimalloc = ["dep:mimalloc"]
# Measurement-only control arm for the one-binary OBJECT IDLETIME floor A/B.
# Production builds do not compile the environment-controlled bypass.
perf-ab-object-idletime-floor = []
# Measurement-only control arm for the one-binary LPOS floor A/B.
perf-ab-lpos-floor = []
# Measurement-only control arm for the exact arity-5 BITPOS range floor.
# The control processes set FR_PERF_AB_BITPOS_RANGE_FLOOR_ORIG=1; production
# builds compile only the candidate classification.
perf-ab-bitpos-range-floor = []
# Measurement-only control arm for the exact two-GET BITFIELD_RO packed floor.
# The control processes set FR_PERF_AB_BITFIELD_RO_TWO_GET_FLOOR_ORIG=1;
# production builds compile only the candidate classification.
perf-ab-bitfield-ro-two-get-floor = []
# Measurement-only control arm for the exact present-key OBJECT ENCODING floor.
# The control processes set FR_PERF_AB_OBJECT_ENCODING_FLOOR_ORIG=1; production
# builds compile only the front-dispatch candidate.
perf-ab-object-encoding-floor = []
# Measurement-only control arm for the exact present-key OBJECT REFCOUNT floor.
# The control processes set FR_PERF_AB_OBJECT_REFCOUNT_FLOOR_ORIG=1; production
# builds compile only the front-dispatch candidate.
perf-ab-object-refcount-floor = []
# Measurement-only control arm for the exact keyless DBSIZE floor. The control
# processes set FR_PERF_AB_DBSIZE_FLOOR_ORIG=1; production builds compile only
# the front-dispatch candidate.
perf-ab-dbsize-floor = []
# Measurement-only control arm for the exact arity-2 ECHO floor. The control
# processes set FR_PERF_AB_ECHO_FLOOR_ORIG=1; production builds compile only
# the front-dispatch candidate.
perf-ab-echo-floor = []
# Measurement-only control arm for the exact `WAIT 0 0` dispatch floor. The
# control processes set FR_PERF_AB_WAIT_ZERO_FLOOR_ORIG=1; production builds
# compile only the front-dispatch candidate.
perf-ab-wait-zero-floor = []
# Measurement-only control arm for the one-binary XADD MAXLEN LIMIT floor A/B.
# The control process sets FR_PERF_AB_XADD_LIMIT_FLOOR_ORIG=1; production builds
# do not compile the environment-controlled bypass.
perf-ab-xadd-limit-floor = []
# Measurement-only control arm for the exact two-field XADD MAXLEN approximate
# floor. The control process sets FR_PERF_AB_XADD_MAXLEN_TWO_FIELDS_FLOOR_ORIG=1;
# production builds compile only the candidate parser branch.
perf-ab-xadd-maxlen-two-fields-floor = []
# Measurement-only control arm for the exact two-field bare XADD dispatch floor.
# The control process sets FR_PERF_AB_XADD_TWO_FIELDS_FLOOR_ORIG=1; production
# builds compile only the candidate classification.
perf-ab-xadd-two-fields-floor = []
# Measurement-only control arm for the exact one-field XADD NOMKSTREAM floor.
# The control process sets FR_PERF_AB_XADD_NOMKSTREAM_FLOOR_ORIG=1; production
# builds compile only the candidate classification.
perf-ab-xadd-nomkstream-floor = []
# Measurement-only control arm for the one-binary XADD MINID approximate
# no-op guard. The control process sets FR_PERF_AB_XTRIM_MINID_NOOP_ORIG=1;
# production builds compile only the candidate path.
perf-ab-xtrim-minid-noop = [
    "fr-runtime/perf-ab-xtrim-minid-noop",
    "fr-command/perf-ab-xtrim-minid-noop",
]
# Measurement-only control arm for the exact standalone
# `XTRIM key MINID ~ 0-0` dispatch floor. Controls preserve the current
# guarded generic route; production builds compile only the floor route.
perf-ab-xtrim-minid-noop-floor = []
# Measurement-only control arm for the exact `XDEL key 0-0` dispatch floor.
# Controls preserve the guarded generic route; production builds compile only
# the floor route.
perf-ab-xdel-missing-floor = []
# Measurement-only control arm for the exact `XACK key group 0-0` dispatch
# floor. Controls preserve the guarded generic route; production builds compile
# only the floor route.
perf-ab-xack-missing-floor = []
# Measurement-only control arm for the exact `XRANGE key 0-0 0-0` dispatch
# floor. Controls preserve the guarded generic range scan; production builds
# compile only the invariant-backed empty-range route.
perf-ab-xrange-zero-floor = []
# Measurement-only control arm for the exact `XREVRANGE key 0-0 0-0`
# dispatch floor. Controls preserve the guarded generic reverse-range scan;
# production builds compile only the invariant-backed empty-range route.
perf-ab-xrevrange-zero-floor = []
# Measurement-only control arm for the arity-four LRANGE front-dispatch floor.
# Controls preserve the current early-cascade route; production builds compile
# only the front classifier using the same parser and runtime executor.
perf-ab-lrange-floor = []
# Measurement-only frozen arm for shared-partition run combining. Control
# processes set FR_PERF_AB_PARTITION_RUN_COMBINE_ORIG=1; production builds
# compile only the candidate that holds one partition guard across a pipelined
# run targeting the same partition.
perf-ab-partition-run-combine = []
# Measurement-only frozen arm for the direct shared-nothing sorted-set path.
# Controls set FR_PERF_AB_SHARED_ZSET_DIRECT_ORIG=1 and retain generic runtime
# dispatch for ZADD/ZPOPMIN in the same ELF.
perf-ab-shared-zset-direct = []
# Measurement-only frozen arm for replica-prefix extraction A/Bs.
bench-reference = []

[[bench]]
name = "replication_prefix_take"
harness = false
required-features = ["bench-reference"]

[[bench]]
name = "inline_args"
harness = false
required-features = ["bench-reference"]
