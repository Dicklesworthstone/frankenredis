[package]
name = "fr-server"
version.workspace = true
edition.workspace = true
license-file.workspace = true
description = "FrankenRedis standalone server binary"

[lib]
name = "fr_server"
path = "src/lib.rs"

[[bin]]
name = "frankenredis"
path = "src/main.rs"

[dependencies]
fr-runtime = { path = "../fr-runtime" }
fr-config = { path = "../fr-config" }
fr-protocol = { path = "../fr-protocol" }
fr-repl = { path = "../fr-repl" }
fr-persist = { path = "../fr-persist" }
fr-command = { path = "../fr-command" }
fr-eventloop = { path = "../fr-eventloop" }
fr-uring = { path = "../fr-uring", optional = true }
foldhash = "0.2"
mio.workspace = true
tikv-jemallocator = { workspace = true, optional = true }
mimalloc = { workspace = true, optional = true }

[features]
# mimalloc by default: 63.6% vs 36.5% geomean parity, 70x better p99 tails
default = ["mimalloc"]
# io_uring batched write submission for the UNPIPELINED regime. Default OFF.
#
# A 2026-07-25 `perf trace -s` census at `-P1 -c50` found one `sendto` per
# operation (229,740 calls = 47.4% of wall time) while a single `epoll_wait`
# already reports ~48 ready connections. This feature defers those per-connection
# writes to the end of the event-loop iteration and submits them as ONE
# `io_uring_enter`. Vendored Redis 7.2.4 measures the same shape (one `write` per
# op, 44.8% of wall) and its per-client write loop cannot batch this way. The
# experiment tests that structural opening; the synchronous implementation's
# measured REJECT and asynchronous-only retry predicate are recorded in
# docs/NEGATIVE_EVIDENCE.md (2026-07-26).
#
# Explicitly NOT a pipelined-throughput lever: at `-P16` the same census measures
# 0.13-0.16 syscalls/op for both engines because a whole batch already coalesces
# into one write. See docs/NEGATIVE_EVIDENCE.md 2026-07-25.
#
# The feature only compiles support. Runtime activation additionally requires
# `--io-uring-output`; an explicit request fails closed if ring creation fails.
# Without the flag, the exact same ELF takes the behaviorally unchanged `mio`
# control path.
io-uring-writes = ["dep:fr-uring"]
jemalloc = ["dep:tikv-jemallocator"]
mimalloc = ["dep:mimalloc"]
# Measurement-only control arm for the one-binary OBJECT IDLETIME floor A/B.
# Production builds do not compile the environment-controlled bypass.
perf-ab-object-idletime-floor = []
# Measurement-only control arm for the one-binary LPOS floor A/B.
perf-ab-lpos-floor = []
# Measurement-only control arm for the one-binary XADD MAXLEN LIMIT floor A/B.
# The control process sets FR_PERF_AB_XADD_LIMIT_FLOOR_ORIG=1; production builds
# do not compile the environment-controlled bypass.
perf-ab-xadd-limit-floor = []
# Measurement-only control arm for the one-binary XADD MINID approximate
# no-op guard. The control process sets FR_PERF_AB_XTRIM_MINID_NOOP_ORIG=1;
# production builds compile only the candidate path.
perf-ab-xtrim-minid-noop = [
    "fr-runtime/perf-ab-xtrim-minid-noop",
    "fr-command/perf-ab-xtrim-minid-noop",
]
# Measurement-only frozen arm for replica-prefix extraction A/Bs.
bench-reference = []

[[bench]]
name = "replication_prefix_take"
harness = false
required-features = ["bench-reference"]

[[bench]]
name = "inline_args"
harness = false
required-features = ["bench-reference"]
